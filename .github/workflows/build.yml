          package ro.calculatorcursa

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.IBinder
          import android.util.Log
          import java.util.Locale

          // Numără kilometrii cu GPS-ul cât timp tura e activă (rulează ca serviciu în prim-plan, cu notificare).
          class ShiftService : Service(), LocationListener {

              private val tag = "FCM-tura"
              private val channel = "tura"
              private val notifId = 41
              private var lm: LocationManager? = null
              private var last: Location? = null
              private var km = 0.0
              private var wake: PowerManager.WakeLock? = null
              private val handler = Handler(Looper.getMainLooper())
              private var lastFixAt = 0L

              // dacă GPS-ul nu mai trimite poziții, repornește cererea
              private val watchdog = object : Runnable {
                  override fun run() {
                      if (Store.activeStart(this@ShiftService) == 0L || Store.isPaused(this@ShiftService)) return
                      if (SystemClock.elapsedRealtime() - lastFixAt > 20000) requestGps()
                      handler.postDelayed(this, 15000)
                  }
              }

              private fun requestGps() {
                  try {
                      val m = getSystemService(LOCATION_SERVICE) as LocationManager
                      lm = m
                      m.removeUpdates(this)
                      m.requestLocationUpdates(LocationManager.GPS_PROVIDER, 2000L, 0f, this)
                  } catch (e: SecurityException) {
                      Log.e(tag, "permisiune locație: $e")
                  } catch (e: Exception) {
                      Log.e(tag, "gps: $e")
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startFg()
                  if (Store.activeStart(this) == 0L || Store.isPaused(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  km = Store.activeKm(this)
                  last = null
                  lastFixAt = SystemClock.elapsedRealtime()
                  try {
                      if (wake == null) {
                          val pm = getSystemService(POWER_SERVICE) as PowerManager
                          val w = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "fcm:tura")
                          w.acquire()
                          wake = w
                      }
                  } catch (e: Exception) {
                      Log.e(tag, "wakelock: $e")
                  }
                  requestGps()
                  handler.removeCallbacks(watchdog)
                  handler.postDelayed(watchdog, 15000)
                  return START_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(channel, "Tură", NotificationManager.IMPORTANCE_LOW))
                  val n = buildNotif()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(notifId, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } else {
                      startForeground(notifId, n)
                  }
              }

              private fun buildNotif(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, channel)
                      .setContentTitle("Tură în curs")
                      .setContentText(String.format(Locale("ro", "RO"), "%.1f km parcurși", km))
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              override fun onLocationChanged(loc: Location) {
                  if (Store.activeStart(this) == 0L || Store.isPaused(this)) {
                      stopSelf()
                      return
                  }
                  lastFixAt = SystemClock.elapsedRealtime()
                  Store.setFix(this, System.currentTimeMillis())
                  if (loc.hasAccuracy() && loc.accuracy > 60f) return

                  val p = last
                  if (p == null) {
                      last = loc
                      return
                  }
                  val d = p.distanceTo(loc)
                  val dt = (loc.time - p.time) / 1000.0
                  if (dt <= 0.0) return

                  // staționar: ignoră zgomotul GPS (punctul de referință rămâne același)
                  if (loc.hasSpeed() && loc.speed < 0.8f && d < 25f) return
                  // salt GPS nerealist (peste 250 km/h): ignorăm segmentul
                  if (d / dt > 70.0) {
                      last = loc
                      return
                  }

                  km += d / 1000.0
                  last = loc
                  Store.setActiveKm(this, km)
                  try {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(notifId, buildNotif())
                  } catch (e: Exception) {
                  }
              }

              // metode necesare pe versiuni vechi de Android
              override fun onProviderEnabled(provider: String) {}

              override fun onProviderDisabled(provider: String) {}

              @Deprecated("necesar pe Android sub 11")
              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}

              override fun onDestroy() {
                  handler.removeCallbacks(watchdog)
                  try {
                      val w = wake
                      if (w != null && w.isHeld) w.release()
                  } catch (e: Exception) {
                  }
                  wake = null
                  try {
                      lm?.removeUpdates(this)
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }
          }
