                  lastStat = now
                  try {
                      val s = "scanări " + nScan + " • ferestre Uber " + nUberWin + " / Bolt " + nBoltWin +
                          "\nOCR pornit " + nOcr + " • reușit " + nOcrOk + " • eșuat " + nOcrFail + " • captură " + lastShotCode +
                          "\noferte citite " + nOffers + " • ultima eroare: " + lastErr
