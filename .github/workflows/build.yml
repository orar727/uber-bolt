          cat > app/src/main/java/ro/calculatorcursa/Parser.kt <<'EOF'
          package ro.calculatorcursa

          data class Offer(
              val platform: String,
              val fare: Double,
              val pickupMin: Double,
              val pickupKm: Double,
              val tripMin: Double,
              val tripKm: Double
          )

          object Parser {
              const val BOLT = "ee.mtakso.driver"
              const val UBER = "com.ubercab.driver"

              // Bolt: "29,92 lei (NET, taxe incluse)", "4 min • 1.8 km", "17 min • 9.7 km"
              private val boltFare = Regex("""(?<![\d.,])(\d[\d.]*(?:,\d{1,2})?)\s*lei(?!\s*/)""", RegexOption.IGNORE_CASE)
              private val boltLeg = Regex("""(\d+)\s*min\W{0,6}(\d+(?:[.,]\d+)?)\s*km""", RegexOption.IGNORE_CASE)

              // Uber: "37,78 RON", "+8,05 RON pentru preluare", "La 2 min. (0.6 km) distanță", "Cursă: 29 min. (16.3 km)"
              private val uberFare = Regex("""(?<![+\d.,])(\d[\d.]*[,.]\d{2})\s*RON(?!\s*/)""", RegexOption.IGNORE_CASE)
              private val uberPickup = Regex("""\b[LI]a\s+(\d+)\s*min\.?\s*\(\s*(\d+(?:[.,]\d+)?)\s*km\s*\)""", RegexOption.IGNORE_CASE)
              private val uberTrip = Regex("""Curs\S{0,2}\s*:?\s*(\d+)\s*min\.?\s*\(\s*(\d+(?:[.,]\d+)?)\s*km\s*\)""", RegexOption.IGNORE_CASE)

              fun num(s: String): Double? {
                  var t = s.trim()
                  if (t.contains(',') && t.contains('.')) {
                      t = if (t.lastIndexOf(',') > t.lastIndexOf('.')) {
                          t.replace(".", "").replace(',', '.')
                      } else {
                          t.replace(",", "")
                      }
                  } else if (t.contains(',')) {
                      t = t.replace(',', '.')
                  }
                  return t.toDoubleOrNull()
              }

              // Platforma se recunoaște după conținutul ecranului, nu după aplicația care a trimis ultimul eveniment
              // (bula Bolt trimite evenimente și când oferta e din Uber).
              fun parseAny(text: String): Offer? {
                  return parseUber(text) ?: parseBolt(text)
              }

              fun parse(pkg: String, text: String): Offer? {
                  return when (pkg) {
                      BOLT -> parseBolt(text)
                      UBER -> parseUber(text)
                      else -> null
                  }
              }

              // Suma cursei = cea mai mare sumă găsită (ignoră bonusul "+x RON" și "RON/km")
              private fun biggest(re: Regex, text: String): Double? {
                  var best: Double? = null
                  for (m in re.findAll(text)) {
                      val v = num(m.groupValues[1]) ?: continue
                      if (best == null || v > best) best = v
                  }
                  return best
              }

              private fun parseBolt(text: String): Offer? {
                  val fare = biggest(boltFare, text) ?: return null
                  val legs = boltLeg.findAll(text).toList()
                  if (legs.size < 2) return null
                  val pMin = num(legs[0].groupValues[1]) ?: return null
                  val pKm = num(legs[0].groupValues[2]) ?: return null
                  val tMin = num(legs[1].groupValues[1]) ?: return null
                  val tKm = num(legs[1].groupValues[2]) ?: return null
                  return Offer("Bolt", fare, pMin, pKm, tMin, tKm)
              }

              private fun parseUber(text: String): Offer? {
                  val fare = biggest(uberFare, text) ?: return null
                  val p = uberPickup.find(text) ?: return null
                  val t = uberTrip.find(text) ?: return null
                  val pMin = num(p.groupValues[1]) ?: return null
                  val pKm = num(p.groupValues[2]) ?: return null
                  val tMin = num(t.groupValues[1]) ?: return null
                  val tKm = num(t.groupValues[2]) ?: return null
                  return Offer("Uber", fare, pMin, pKm, tMin, tKm)
              }
          }
          EOF
          cat > app/src/main/java/ro/calculatorcursa/RideAccessibilityService.kt <<'EOF'
          package ro.calculatorcursa

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityService.ScreenshotResult
          import android.accessibilityservice.AccessibilityService.TakeScreenshotCallback
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Log
          import android.view.Display
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.util.Locale

          class RideAccessibilityService : AccessibilityService() {

              private val tag = "CalculatorCursa"
              private val handler = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var overlay: LinearLayout? = null
              private var title: TextView? = null
              private var detail: TextView? = null

              private var lastScan = 0L
              private var lastOcr = 0L
              private var ocrBusy = false
              private var lastOfferAt = 0L
              private var lastAppAt = 0L
              private var lastKey = ""

              private val recognizer by lazy {
                  TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
              }

              private val tick = object : Runnable {
                  override fun run() {
                      val now = SystemClock.uptimeMillis()
                      scan()
                      if (overlay != null && now - lastOfferAt > 3500) removeOverlay()
                      handler.postDelayed(this, 600)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  handler.postDelayed(tick, 600)
              }

              override fun onInterrupt() {
                  removeOverlay()
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  removeOverlay()
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  if (pkg != Parser.BOLT && pkg != Parser.UBER) return
                  lastAppAt = SystemClock.uptimeMillis()
                  scan()
              }

              // 1) textul ferestrelor Bolt/Uber de pe ecran (și cardul de ofertă afișat peste Waze),
              // 2) textul ferestrei active, 3) OCR pe captură de ecran, cât timp aplicațiile de șofer sunt active
              private fun scan() {
                  val now = SystemClock.uptimeMillis()
                  if (now - lastScan < 300) return
                  lastScan = now

                  var driverWindow = false
                  try {
                      for (w in windows) {
                          val r = w.root ?: continue
                          val p = r.packageName?.toString()
                          if (p == Parser.UBER || p == Parser.BOLT) {
                              driverWindow = true
                              val lines = ArrayList<String>()
                              collect(r, lines, 0)
                              if (handleText(lines.joinToString("\n"))) return
                          }
                      }
                  } catch (e: Exception) {
                      Log.e(tag, "windows: $e")
                  }

                  val root = rootInActiveWindow
                  if (root != null) {
                      val lines = ArrayList<String>()
                      collect(root, lines, 0)
                      if (handleText(lines.joinToString("\n"))) return
                  }

                  if (driverWindow || now - lastAppAt < 25000) ocr()
              }

              private fun handleText(text: String): Boolean {
                  var parsed: Offer? = null
                  try {
                      parsed = Parser.parseAny(text)
                  } catch (e: Exception) {
                      Log.e(tag, "parse: $e")
                  }
                  val offer = parsed ?: return false

                  lastOfferAt = SystemClock.uptimeMillis()
                  val key = "${offer.platform}|${offer.fare}|${offer.pickupKm}|${offer.tripKm}|${offer.tripMin}"
                  if (key == lastKey && overlay != null) return true
                  lastKey = key

                  val r = Calc.compute(this, offer)
                  Log.d(tag, "oferta=$offer rezultat=$r")
                  show(offer, r)
                  return true
              }

              private fun ocr() {
                  if (Build.VERSION.SDK_INT < 30) return
                  if (ocrBusy) return
                  val now = SystemClock.uptimeMillis()
                  if (now - lastOcr < 800) return
                  lastOcr = now
                  ocrBusy = true

                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              var sw: Bitmap? = null
                              try {
                                  val hb = result.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  sw = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                              } catch (e: Exception) {
                                  Log.e(tag, "bitmap: $e")
                              }
                              if (sw == null) {
                                  ocrBusy = false
                                  return
                              }
                              recognizer.process(InputImage.fromBitmap(sw, 0))
                                  .addOnSuccessListener { t ->
                                      Log.d(tag, "OCR: " + t.text.replace("\n", " | "))
                                      handleText(t.text)
                                  }
                                  .addOnFailureListener { e -> Log.e(tag, "ocr: $e") }
                                  .addOnCompleteListener { ocrBusy = false }
                          }

                          override fun onFailure(errorCode: Int) {
                              Log.e(tag, "screenshot eroare $errorCode")
                              ocrBusy = false
                          }
                      })
                  } catch (e: Exception) {
                      Log.e(tag, "takeScreenshot: $e")
                      ocrBusy = false
                  }
              }

              private fun collect(n: AccessibilityNodeInfo?, out: MutableList<String>, depth: Int) {
                  if (n == null || depth > 40) return
                  val t = n.text
                  if (t != null && t.isNotBlank()) {
                      out.add(t.toString())
                  } else {
                      val d = n.contentDescription
                      if (d != null && d.isNotBlank()) out.add(d.toString())
                  }
                  for (i in 0 until n.childCount) {
                      collect(n.getChild(i), out, depth + 1)
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun fmt(v: Double): String = String.format(Locale("ro", "RO"), "%.2f", v)

              // Textul din bandă nu conține "lei", "RON", "min" sau "km", ca OCR-ul să nu îl confunde cu oferta.
              private fun show(o: Offer, r: Result) {
                  val manager = wm ?: return
                  val word: String
                  val color: Int
                  when (r.verdict) {
                      2 -> {
                          word = "ACCEPTĂ"
                          color = Color.parseColor("#E6118C5A")
                      }
                      1 -> {
                          word = "LIMITĂ"
                          color = Color.parseColor("#E6B36B00")
                      }
                      else -> {
                          word = "REFUZĂ"
                          color = Color.parseColor("#E6C62832")
                      }
                  }

                  if (overlay == null) {
                      val box = LinearLayout(this)
                      box.orientation = LinearLayout.VERTICAL
                      box.setPadding(dp(14), dp(10), dp(14), dp(10))

                      val t = TextView(this)
                      t.setTextColor(Color.WHITE)
                      t.textSize = 22f
                      t.setTypeface(Typeface.DEFAULT_BOLD)

                      val d = TextView(this)
                      d.setTextColor(Color.WHITE)
                      d.textSize = 15f

                      box.addView(t)
                      box.addView(d)

                      val lp = WindowManager.LayoutParams(
                          resources.displayMetrics.widthPixels - dp(32),
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      )
                      lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      lp.y = (resources.displayMetrics.heightPixels * 0.17).toInt()

                      try {
                          manager.addView(box, lp)
                          overlay = box
                          title = t
                          detail = d
                      } catch (e: Exception) {
                          Log.e(tag, "overlay: $e")
                          return
                      }
                  }

                  val bg = GradientDrawable()
                  bg.setColor(color)
                  bg.cornerRadius = dp(10).toFloat()
                  overlay?.background = bg
                  title?.text = "$word   profit ${fmt(r.net)}"
                  detail?.text = "${fmt(r.perKm)} /km  •  ${fmt(r.perHour)} /oră  •  combustibil ${fmt(r.fuel)}"
              }

              private fun removeOverlay() {
                  val v = overlay ?: return
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  overlay = null
                  title = null
                  detail = null
                  lastKey = ""
              }
          }
          EOF
