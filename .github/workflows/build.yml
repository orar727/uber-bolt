              private fun hasLocationPermission(): Boolean =
                  checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED

              private fun startShift() {
                  if (!hasLocationPermission()) {
                      val list = ArrayList<String>()
                      list.add(Manifest.permission.ACCESS_FINE_LOCATION)
                      list.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                      if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                      requestPermissions(list.toTypedArray(), 7)
                      return
                  }
                  val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                  if (!lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                      Toast.makeText(this, "Pornește locația (GPS) din setările telefonului", Toast.LENGTH_LONG).show()
                      return
                  }
                  Store.startShift(this)
                  startForegroundService(Intent(this, ShiftService::class.java))
                  askBattery()
                  show(0)
              }

              private fun askBattery() {
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun pauseShift() {
                  Store.pauseShift(this)
                  stopService(Intent(this, ShiftService::class.java))
                  show(0)
              }

              private fun resumeShift() {
                  if (!hasLocationPermission()) {
                      startShift()
                      return
                  }
                  Store.resumeShift(this)
                  startForegroundService(Intent(this, ShiftService::class.java))
                  show(0)
              }

              private fun endShift() {
                  stopService(Intent(this, ShiftService::class.java))
                  Store.endShift(this)
                  show(0)
              }

