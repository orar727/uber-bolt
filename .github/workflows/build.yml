                  return "" + (m / 60) + "h " + (m % 60).toString().padStart(2, '0') + "m"
              }

              private fun stat(value: String, label: String, color: Int): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.addView(Ui.text(this, value, 20f, color, true))
                  l.addView(Ui.text(this, label, 12f, Ui.MUTED))
                  return l
              }

              private fun statsRow(vararg items: LinearLayout): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.setPadding(0, dp(10), 0, dp(2))
                  for (it in items) {
                      r.addView(it, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  return r
              }

              private fun listRow(left: String, sub: String, onEdit: (() -> Unit)?, onDelete: () -> Unit): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.setPadding(0, dp(8), 0, dp(8))
                  val tv = LinearLayout(this)
                  tv.orientation = LinearLayout.VERTICAL
                  tv.addView(Ui.text(this, left, 15f))
                  tv.addView(Ui.text(this, sub, 12f, Ui.MUTED))
                  if (onEdit != null) tv.setOnClickListener { onEdit() }
                  r.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  val d = Ui.text(this, "Șterge", 13f, Ui.BAD, true)
                  d.setPadding(dp(12), dp(8), 0, dp(8))
                  d.setOnClickListener { onDelete() }
                  r.addView(d)
                  return r
              }

              // ---------------- fila TURĂ ----------------

              private fun hasLocationPermission(): Boolean =
                  checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED

              private fun startShift() {
                  if (!hasLocationPermission()) {
                      val list = ArrayList<String>()
                      list.add(Manifest.permission.ACCESS_FINE_LOCATION)
                      list.add(Manifest.permission.ACCESS_COARSE_LOCATION)
                      if (Build.VERSION.SDK_INT >= 33) list.add(Manifest.permission.POST_NOTIFICATIONS)
                      requestPermissions(list.toTypedArray(), 7)
                      return
                  }
                  val lm = getSystemService(LOCATION_SERVICE) as LocationManager
                  if (!lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                      Toast.makeText(this, "Pornește locația (GPS) din setările telefonului", Toast.LENGTH_LONG).show()
                      return
                  }
                  // în aceeași săptămână (luni–duminică) soldul de început = soldul introdus la finalul turei precedente
                  val ws = startOfWeek(System.currentTimeMillis())
                  val pb = Store.weekBolt(this, ws)
                  val pu = Store.weekUber(this, ws)
                  if (pb != null && pu != null) {
                      doStart(pb, pu)
                      return
                  }
                  twoDialog(
                      "Începe tura",
                      "Săptămână nouă: treci soldul afișat acum în aplicații. În restul săptămânii (până duminică) se preia singur din tura precedentă.",
                      "Sold Bolt acum (lei)", "Sold Uber acum (lei)", pb, pu,
                      "Începe", "Fără sold",
                      { b, u -> doStart(b, u) },
                      { doStart(null, null) }
                  )
              }

              private fun doStart(b: Double?, u: Double?) {
                  Store.startShift(this)
                  Store.setStartBalance(this, b, u)
                  startForegroundService(Intent(this, ShiftService::class.java))
                  askBattery()
                  show(0)
              }

              private fun askBattery() {
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun pauseShift() {
                  Store.pauseShift(this)
                  stopService(Intent(this, ShiftService::class.java))
                  show(0)
              }

              private fun resumeShift() {
                  if (!hasLocationPermission()) {
                      startShift()
                      return
                  }
                  Store.resumeShift(this)
                  startForegroundService(Intent(this, ShiftService::class.java))
                  show(0)
              }

              private fun endShift() {
                  stopService(Intent(this, ShiftService::class.java))
                  val b0 = Store.startBoltBal(this)
                  val u0 = Store.startUberBal(this)
                  val msg = if (b0 == null && u0 == null) {
                      "Nu ai trecut solul de la început, deci încasările nu se pot calcula. Poți să le adaugi după, atingând tura din listă."
                  } else {
                      "Sold la început: Bolt " + (if (b0 != null) Ui.num(b0, 2) else "—") + ", Uber " + (if (u0 != null) Ui.num(u0, 2) else "—") + ". Treci soldul de acum."
                  }
                  twoDialog(
                      "Închide tura • " + Ui.num(Store.activeKm(this), 1) + " km",
                      msg,
                      "Sold Bolt acum (lei)", "Sold Uber acum (lei)", null, null,
                      "Închide tura", "Fără sold",
                      { b, u ->
                          Store.endShift(this, b, u)
                          show(0)
                      },
                      {
                          Store.endShift(this, null, null)
                          show(0)
                      }
                  )
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 7) {
                      if (hasLocationPermission()) {
                          startShift()
                      } else {
                          Toast.makeText(this, "Fără permisiunea de locație nu pot număra kilometrii", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun buildShift(col: LinearLayout) {
                  val active = Store.activeStart(this) != 0L
                  val paused = active && Store.isPaused(this)

                  val c = Ui.hero(this)
                  c.addView(Ui.text(this, if (paused) "TURĂ PE PAUZĂ" else if (active) "TURĂ ÎN CURS" else "TURĂ", 12f, if (paused) Ui.BAD else Ui.MUTED, true))
                  val kmView = Ui.text(this, "", 56f, if (paused) Ui.MUTED else Ui.ACCENT, true)
                  val timeView = Ui.text(this, "", 16f, Ui.TEXT)
                  val gpsView = Ui.text(this, "", 13f, Ui.MUTED)
                  if (active) {
                      c.addView(kmView)
                      c.addView(timeView)
                      c.addView(gpsView)
                      val b0 = Store.startBoltBal(this)
                      val u0 = Store.startUberBal(this)
                      val balText = "Sold început: Bolt " + (if (b0 != null) Ui.num(b0, 2) else "—") + " • Uber " + (if (u0 != null) Ui.num(u0, 2) else "—") + "  (atinge pentru a modifica)"
                      val balView = Ui.text(this, balText, 12f, Ui.MUTED)
                      balView.setPadding(0, dp(6), 0, 0)
                      balView.setOnClickListener {
                          twoDialog(
                              "Sold la începutul turei", "", "Sold Bolt (lei)", "Sold Uber (lei)", b0, u0,
                              "Salvează", "Anulează",
                              { b, u ->
                                  Store.setStartBalance(this, b, u)
                                  show(0)
                              },
                              { }
                          )
                      }
                      c.addView(balView)
                      if (paused) {
                          c.addView(Ui.button(this, "Reia tura", true) { resumeShift() })
                          c.addView(Ui.danger(this, "Închide tura") { endShift() })
                      } else {
                          c.addView(Ui.button(this, "Pauză", false) { pauseShift() })
                          c.addView(Ui.danger(this, "Închide tura") { endShift() })
                      }
                  } else {
                      val hint = Ui.text(this, "Apasă pentru a număra kilometrii cu GPS-ul, până când închizi tura.", 14f, Ui.MUTED)
                      hint.setPadding(0, dp(6), 0, 0)
                      c.addView(hint)
                      c.addView(Ui.button(this, "Începe tura", true) { startShift() })
                  }
                  col.addView(c)

                  val shifts = Store.shifts(this)
                  val now = System.currentTimeMillis()
                  val dayStart = startOfDay(now)
                  val monthStart = startOfMonth(now)
                  val weekStart = startOfWeek(now)
                  val fills = Store.fills(this)
                  val starts = longArrayOf(dayStart, weekStart, monthStart, 0L)
                  val names = listOf("Azi", "Săptămâna", "Luna", "Total")
                  val kmS = DoubleArray(4)
                  val incS = DoubleArray(4)
                  val gplS = DoubleArray(4)
                  val tipS = DoubleArray(4)
                  for (sh in shifts) {
                      for (k in 0 until 4) {
                          if (sh.start >= starts[k]) {
                              kmS[k] += sh.km
                              incS[k] += sh.bolt + sh.uber
                          }
                      }
                  }
                  if (active) {
                      val ak = Store.activeKm(this)
                      for (k in 0 until 4) {
                          if (Store.activeStart(this) >= starts[k]) kmS[k] += ak
                      }
                  }
                  for (f in fills) {
                      for (k in 0 until 4) {
                          if (f.date >= starts[k]) gplS[k] += f.total
                      }
                  }
                  for (t in Store.tips(this)) {
                      for (k in 0 until 4) {
                          if (t.date >= starts[k]) tipS[k] += t.tip
                      }
                  }
                  val sum = Ui.card(this)
                  sum.addView(Ui.text(this, "STATISTICI", 12f, Ui.MUTED, true))
                  sum.addView(tableRow("", "Km", "Încasat", "Tips", "GPL", "Profit", true, Ui.MUTED))
                  sum.addView(Ui.divider(this))
                  for (k in 0 until 4) {
                      val pr = incS[k] + tipS[k] - gplS[k]
                      sum.addView(
                          tableRow(
                              names[k], Ui.num(kmS[k], 1), Ui.num(incS[k], 0), Ui.num(tipS[k], 0), Ui.num(gplS[k], 0), Ui.num(pr, 0),
                              false, if (pr >= 0.0) Ui.GOOD else Ui.BAD
                          )
                      )
                      if (k < 3) sum.addView(Ui.divider(this))
                  }
                  val foot = Ui.text(this, "Încasat = diferența de sold (final − început). Profit = încasat + tips − GPL din bonuri. O tură se numără în ziua în care a început.", 11f, Ui.MUTED)
                  foot.setPadding(0, dp(8), 0, 0)
                  sum.addView(foot)
                  col.addView(sum)

                  buildTips(col)

                  val recent = Ui.card(this)
                  recent.addView(Ui.text(this, "TURE ÎNCHEIATE", 12f, Ui.MUTED, true))
                  if (shifts.isEmpty()) {
                      val e = Ui.text(this, "Nicio tură încă.", 14f, Ui.MUTED)
                      e.setPadding(0, dp(8), 0, 0)
                      recent.addView(e)
                  }
                  val df = SimpleDateFormat("dd.MM HH:mm", loc)
                  for (s in shifts.take(10)) {
                      val left = df.format(Date(s.start)) + "  •  " + Ui.num(s.km, 1) + " km"
                      val inc = s.bolt + s.uber
                      var sub = "durată " + fmtDur(s.end - s.start - s.pausedMs)
                      if (inc != 0.0) {
                          sub += "  •  încasat " + Ui.num(inc, 2) + " lei"
                          if (s.km > 0.5) sub += "  •  " + Ui.num(inc / s.km, 2) + " lei/km"
                      } else {
                          sub += "  •  atinge pentru a adăuga încasările"
                      }
                      val editAction: () -> Unit = {
                          twoDialog(
                              "Încasări tură", "Suma făcută în tură, pe fiecare aplicație.",
                              "Încasat Bolt (lei)", "Încasat Uber (lei)",
                              if (s.bolt != 0.0) s.bolt else null, if (s.uber != 0.0) s.uber else null,
                              "Salvează", "Anulează",
                              { b, u ->
                                  Store.setIncome(this, s.id, b ?: 0.0, u ?: 0.0)
                                  show(0)
                              },
                              { }
                          )
                      }
                      recent.addView(listRow(left, sub, editAction) {
                          Store.deleteShift(this, s.id)
                          show(0)
                      })
                  }
                  col.addView(recent)

                  if (active) {
                      val r = object : Runnable {
                          override fun run() {
                              val st = Store.activeStart(this@MainActivity)
                              if (st == 0L) return
                              kmView.text = Ui.num(Store.activeKm(this@MainActivity), 1) + " km"
                              timeView.text = "durată " + fmtDur(Store.activeElapsed(this@MainActivity))
                              if (Store.isPaused(this@MainActivity)) {
                                  gpsView.text = "GPS oprit în pauză"
                                  gpsView.setTextColor(Ui.MUTED)
                              } else {
                                  val fx = Store.lastFix(this@MainActivity)
                                  val ago = if (fx == 0L) -1L else (System.currentTimeMillis() - fx) / 1000
                                  if (ago in 0..10) {
                                      gpsView.text = "GPS: semnal bun"
                                      gpsView.setTextColor(Ui.GOOD)
                                  } else if (ago > 10) {
                                      gpsView.text = "GPS: fără poziție de " + ago + " s"
                                      gpsView.setTextColor(Ui.BAD)
                                  } else {
                                      gpsView.text = "GPS: aștept prima poziție…"
                                      gpsView.setTextColor(Ui.MUTED)
                                  }
                              }
                              handler.postDelayed(this, 1000)
                          }
                      }
                      live = r
                      r.run()
                  }
              }

              // ---------------- bacșiș ----------------

              private fun buildTips(col: LinearLayout) {
                  val card = Ui.card(this)
                  card.addView(Ui.text(this, "BACȘIȘ (CASH)", 12f, Ui.MUTED, true))
                  val hint = Ui.text(this, "Ex.: clientul dă 100, comanda 60, tu dai rest 30 → bacșiș 10. Dacă nu dai rest, lasă câmpul gol: bacșișul e cash − comandă.", 13f, Ui.MUTED)
                  hint.setPadding(0, dp(6), 0, dp(4))
                  card.addView(hint)
                  val inCash = Ui.input(this, "Cât ți-a dat clientul (lei)", true)
                  val inFare = Ui.input(this, "Prețul comenzii (lei)", true)
                  val inRest = Ui.input(this, "Rest dat clientului (lei, opțional)", true)
                  val res = Ui.text(this, "", 15f, Ui.TEXT)
                  res.setPadding(0, dp(8), 0, 0)
                  val resTip = Ui.text(this, "", 22f, Ui.ACCENT, true)
                  card.addView(inCash, Ui.lp(this, 8, 8))
                  card.addView(inFare, Ui.lp(this, 8))
                  card.addView(inRest, Ui.lp(this, 0))
                  card.addView(res)
                  card.addView(resTip)
                  val watcher = object : TextWatcher {
                      override fun beforeTextChanged(x: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(x: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(x: Editable?) {
                          val c = parseMoney(inCash)
                          val f = parseMoney(inFare)
                          val r = parseMoney(inRest) ?: 0.0
                          if (c != null && f != null) {
                              val due = c - f
                              val t = c - f - r
                              if (due < 0.0) {
                                  res.text = "Cashul e mai mic decât comanda"
                                  resTip.text = ""
                              } else if (t < 0.0) {
                                  res.text = "Restul e prea mare: din " + Ui.num(c, 2) + " cu comanda de " + Ui.num(f, 2) + " restul maxim e " + Ui.num(due, 2)
                                  resTip.text = ""
                              } else {
                                  res.text = "Rest de dat fără bacșiș: " + Ui.num(due, 2) + " lei\nRest dat: " + Ui.num(r, 2) + " lei\nCash rămas la tine: " + Ui.num(c - r, 2) + " lei"
                                  resTip.text = if (t > 0.0) "Bacșiș: " + Ui.num(t, 2) + " lei" else "Fără bacșiș"
                                  resTip.setTextColor(if (t > 0.0) Ui.GOOD else Ui.MUTED)
                              }
                          } else {
                              res.text = ""
                              resTip.text = ""
                          }
                      }
                  }
                  inCash.addTextChangedListener(watcher)
                  inFare.addTextChangedListener(watcher)
                  inRest.addTextChangedListener(watcher)
                  card.addView(Ui.button(this, "Adaugă bacșișul", true) {
                      val c = parseMoney(inCash)
                      val f = parseMoney(inFare)
                      val r = parseMoney(inRest) ?: 0.0
                      if (c == null || f == null || f <= 0.0) {
                          Toast.makeText(this, "Completează cât ți-a dat clientul și prețul comenzii", Toast.LENGTH_SHORT).show()
                      } else if (c - f - r <= 0.0) {
                          Toast.makeText(this, "Nu rezultă bacșiș. Verifică cifrele", Toast.LENGTH_SHORT).show()
                      } else {
                          Store.addTip(this, c, f, r)
                          Toast.makeText(this, "Bacșiș salvat: " + Ui.num(c - f - r, 2) + " lei", Toast.LENGTH_SHORT).show()
                          show(0)
                      }
                  })
                  val tips = Store.tips(this)
                  if (tips.isNotEmpty()) {
                      val now = System.currentTimeMillis()
                      val ds = startOfDay(now)
                      val ws = startOfWeek(now)
                      val ms = startOfMonth(now)
                      var d = 0.0
                      var w = 0.0
                      var m = 0.0
                      for (t in tips) {
                          if (t.date >= ds) d += t.tip
                          if (t.date >= ws) w += t.tip
                          if (t.date >= ms) m += t.tip
                      }
                      card.addView(
                          statsRow(
                              stat(Ui.num(d, 2), "azi (lei)", Ui.GOOD),
                              stat(Ui.num(w, 2), "săptămâna", Ui.GOOD),
                              stat(Ui.num(m, 2), "luna", Ui.GOOD)
                          )
                      )
                      val df = SimpleDateFormat("dd.MM HH:mm", loc)
                      for (t in tips.take(5)) {
                          val left = df.format(Date(t.date)) + "  •  +" + Ui.num(t.tip, 2) + " lei"
                          val sub = "cash " + Ui.num(t.cash, 2) + " − comandă " + Ui.num(t.fare, 2) + (if (t.rest > 0.0) " − rest " + Ui.num(t.rest, 2) else "")
                          card.addView(listRow(left, sub, null) {
                              Store.deleteTip(this, t.id)
                              show(0)
                          })
                      }
                  }
                  col.addView(card)
              }

              // ---------------- fila GPL ----------------

              private fun buildGpl(col: LinearLayout) {
                  val fills = Store.fills(this)
                  val nowMs = System.currentTimeMillis()
                  val monthStart = startOfMonth(nowMs)
                  val weekStart = startOfWeek(nowMs)
                  val dayStart = startOfDay(nowMs)
                  var spent = 0.0
                  var liters = 0.0
                  var month = 0.0
                  var week = 0.0
                  var day = 0.0
                  for (f in fills) {
                      spent += f.total
                      liters += f.liters
                      if (f.date >= monthStart) month += f.total
                      if (f.date >= weekStart) week += f.total
                      if (f.date >= dayStart) day += f.total
                  }
                  val avg = if (liters > 0.0) spent / liters else 0.0

                  val sum = Ui.hero(this)
                  sum.addView(Ui.text(this, "CHELTUIT PE GPL", 12f, Ui.MUTED, true))
                  sum.addView(Ui.text(this, Ui.num(spent, 2) + " lei", 40f, Ui.ACCENT, true))
                  sum.addView(
                      statsRow(
                          stat(Ui.num(day, 0), "azi (lei)", Ui.TEXT),
                          stat(Ui.num(week, 0), "săptămâna (lei)", Ui.TEXT),
                          stat(Ui.num(month, 0), "luna (lei)", Ui.TEXT)
                      )
                  )
                  sum.addView(
                      statsRow(
                          stat(Ui.num(liters, 1), "litri în total", Ui.TEXT),
                          stat(Ui.num(avg, 2), "preț mediu /l", Ui.TEXT),
                          stat(Ui.num(fills.size.toDouble(), 0), "alimentări", Ui.TEXT)
                      )
                  )

                  // consum și cost pe km, din kilometrii de bord de la alimentări
                  val withOdo = fills.filter { it.odo > 0.0 }.sortedBy { it.odo }
                  var info = "Adaugă și kilometrii de bord la alimentări, ca să calculez consumul și costul pe km."
                  if (withOdo.size >= 2) {
                      val dist = withOdo.last().odo - withOdo.first().odo
                      if (dist > 0.0) {
                          var l = 0.0
                          var t = 0.0
                          for (i in 1 until withOdo.size) {
                              l += withOdo[i].liters
                              t += withOdo[i].total
                          }
                          info = "Consum mediu " + Ui.num(l / dist * 100.0, 1) + " l/100 km  •  cost " +
                              Ui.num(t / dist, 2) + " lei/km (pe " + Ui.num(dist, 0) + " km)"
                      }
                  }
                  val infoView = Ui.text(this, info, 13f, Ui.MUTED)
                  infoView.setPadding(0, dp(10), 0, 0)
                  sum.addView(infoView)
                  col.addView(sum)

                  // formular bon nou
                  val sdf = SimpleDateFormat("dd.MM.yyyy", loc)
                  val form = Ui.card(this)
                  form.addView(Ui.text(this, "BON NOU", 12f, Ui.MUTED, true))
                  form.addView(Ui.button(this, "Fotografiază bonul", false) { takePhoto() })
                  form.addView(Ui.button(this, "Alege poza din galerie", false) { pickPhoto() })
                  if (pendNote.isNotEmpty()) {
                      val n = Ui.text(this, pendNote, 13f, Ui.ACCENT)
                      n.setPadding(0, dp(8), 0, 0)
                      form.addView(n)
                  }
                  val inL = Ui.input(this, "Litri alimentați", true)
                  val inT = Ui.input(this, "Total pe bon (lei)", true)
                  val inO = Ui.input(this, "Km de bord (opțional)", true)
                  val inD = Ui.input(this, "Data (zz.ll.aaaa)", false)
                  inD.setText(if (pendD.isNotEmpty()) pendD else sdf.format(Date()))
                  if (pendL.isNotEmpty()) inL.setText(pendL)
                  if (pendT.isNotEmpty()) inT.setText(pendT)
                  form.addView(inL, Ui.lp(this, 8, 10))
                  form.addView(inT, Ui.lp(this, 8))
                  form.addView(inO, Ui.lp(this, 8))
                  form.addView(inD, Ui.lp(this, 4))
                  form.addView(Ui.button(this, "Adaugă bonul", true) {
                      val l = inL.text.toString().replace(',', '.').toDoubleOrNull()
                      val t = inT.text.toString().replace(',', '.').toDoubleOrNull()
                      val o = inO.text.toString().replace(',', '.').toDoubleOrNull() ?: 0.0
                      sdf.isLenient = false
                      var d: Date? = null
                      try {
                          d = sdf.parse(inD.text.toString().trim())
                      } catch (e: Exception) {
                      }
                      if (l == null || l <= 0.0 || t == null || t <= 0.0) {
                          Toast.makeText(this, "Completează litrii și totalul", Toast.LENGTH_SHORT).show()
                      } else if (d == null) {
                          Toast.makeText(this, "Data trebuie să fie zz.ll.aaaa", Toast.LENGTH_SHORT).show()
                      } else {
                          Store.addFill(this, d.time, l, t, o)
                          pendL = ""
                          pendT = ""
                          pendP = ""
                          pendD = ""
                          pendNote = ""
                          rawText = ""
                          Toast.makeText(this, "Bon salvat", Toast.LENGTH_SHORT).show()
                          show(1)
                      }
                  })
                  if (rawText.isNotEmpty()) {
                      val rt = Ui.text(this, "Text citit din poză:\n" + rawText, 11f, Ui.MUTED)
                      rt.setTextIsSelectable(true)
                      rt.setPadding(0, dp(10), 0, 0)
                      form.addView(rt)
