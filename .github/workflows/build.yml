                                      }
                                  }
                                  .addOnFailureListener { e ->
                                      nOcrFail++
                                      lastErr = "ocr: " + e.toString().take(60)
                                      Log.e(tag, "ocr: $e")
                                  }
                                  .addOnCompleteListener { ocrBusy = false }
                          }

                          override fun onFailure(errorCode: Int) {
                              Log.e(tag, "screenshot eroare $errorCode")
                              lastShotCode = "eroare $errorCode"
                              nOcrFail++
                              ocrBusy = false
                          }
                      })
                  } catch (e: Exception) {
                      Log.e(tag, "takeScreenshot: $e")
                      lastErr = "takeScreenshot: " + e.toString().take(60)
                      ocrBusy = false
                  }
              }

              private fun saveStat() {
