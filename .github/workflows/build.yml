              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK) return
                  if (requestCode == 21) {
                      val u = data?.data
                      if (u != null) {
                          try {
                              contentResolver.openOutputStream(u)?.use { it.write(Store.exportAll(this).toByteArray(Charsets.UTF_8)) }
                              Toast.makeText(this, "Datele au fost salvate", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "Nu am putut salva fișierul", Toast.LENGTH_LONG).show()
                          }
                      }
                      return
                  }
                  if (requestCode == 22) {
                      val u = data?.data
                      if (u != null) {
                          var ok = false
                          try {
                              val txt = contentResolver.openInputStream(u)?.use { String(it.readBytes(), Charsets.UTF_8) }
                              if (txt != null) ok = Store.importAll(this, txt)
                          } catch (e: Exception) {
                          }
                          Toast.makeText(this, if (ok) "Datele au fost importate" else "Fișier necunoscut sau stricat", Toast.LENGTH_LONG).show()
                          show(tab)
                      }
                      return
                  }
                  var uri: Uri? = null
                  if (requestCode == 11) {
                      uri = Uri.fromFile(File(cacheDir, "bon.jpg"))
                  } else if (requestCode == 12) {
                      uri = data?.data
                  }
                  if (uri != null) readReceipt(uri)
              }

              private fun loadBitmap(uri: Uri): Bitmap? {
                  try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                      var sample = 1
                      while (maxOf(o.outWidth, o.outHeight) / sample > 3000) sample *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = sample
                      var bmp: Bitmap? = null
                      contentResolver.openInputStream(uri)?.use { bmp = BitmapFactory.decodeStream(it, null, o2) }
                      val b = bmp ?: return null
                      var deg = 0
                      try {
                          contentResolver.openInputStream(uri)?.use {
                              val ex = ExifInterface(it)
                              val ori = ex.getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)
                              deg = if (ori == 6) 90 else if (ori == 3) 180 else if (ori == 8) 270 else 0
                          }
                      } catch (e: Exception) {
                      }
                      if (deg == 0) return b
                      val m = Matrix()
                      m.postRotate(deg.toFloat())
                      return Bitmap.createBitmap(b, 0, 0, b.width, b.height, m, true)
                  } catch (e: Exception) {
                      return null
                  }
              }

              private fun readReceipt(uri: Uri) {
                  Toast.makeText(this, "Citesc bonul…", Toast.LENGTH_SHORT).show()
                  Thread {
                      val bmp = loadBitmap(uri)
                      runOnUiThread {
                          if (bmp == null) {
                              Toast.makeText(this, "Nu am putut deschide poza", Toast.LENGTH_LONG).show()
                          } else {
                              recognizer.process(InputImage.fromBitmap(bmp, 0))
                                  .addOnSuccessListener { t -> applyReceipt(t.text) }
                                  .addOnFailureListener { e ->
                                      Toast.makeText(this, "Citirea a eșuat: " + e.toString().take(80), Toast.LENGTH_LONG).show()
                                  }
                          }
                      }
                  }.start()
              }

              private fun applyReceipt(text: String) {
                  rawText = text
                  val r = ReceiptParser.parse(text)
                  val l = r.liters
                  val t = r.total
                  val p = r.price
                  val d = r.date
                  pendL = if (l != null) Ui.num(l, 2) else ""
                  pendT = if (t != null) Ui.num(t, 2) else ""
                  pendP = if (p != null) Ui.num(p, 2) else ""
                  pendD = if (d != null) SimpleDateFormat("dd.MM.yyyy", loc).format(Date(d)) else ""
                  pendNote = if (text.isBlank()) {
                      "Nu am citit niciun text de pe poză. Fă poza mai aproape, cu lumină bună."
                  } else if (l == null && t == null) {
                      "Nu am găsit valori pe poză. Încearcă o poză dreaptă, cu lumină bună, cu tot bonul în cadru."
                  } else if (r.sure) {
                      "Citit din poză: " + pendL + " l × " + pendP + " lei/l = " + pendT + " lei. Verifică înainte să salvezi."
                  } else {
                      "Citire nesigură. Verifică și completează ce lipsește."
                  }
                  show(1)
              }

