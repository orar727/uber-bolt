                      if (me != null) {
                          val res = FloatArray(2)
                          android.location.Location.distanceBetween(me.latitude, me.longitude, a.latitude, a.longitude, res)
                          val dirs = arrayOf("N", "NE", "E", "SE", "S", "SV", "V", "NV")
                          val br = ((res[1] + 360f) % 360f)
                          val dir = dirs[((br + 22.5f) / 45f).toInt() % 8]
                          rel = "  •  " + String.format(Locale("ro", "RO"), "%.1f", res[0] / 1000f) + " km spre " + dir
                      }
                      val tile = try {
                          buildTile(a.latitude, a.longitude)
                      } catch (e: Exception) {
                          lastErr = "hartă: " + e.toString().take(50)
                          null
                      }
                      return GeoInfo(zone, rel, tile)
                  } catch (e: Exception) {
                      lastErr = "geo: " + e.toString().take(60)
                      return null
                  }
