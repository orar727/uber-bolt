          package ro.calculatorcursa

          import java.util.Calendar

          data class Receipt(val liters: Double?, val price: Double?, val total: Double?, val date: Long?, val sure: Boolean)

          // Extrage litrii, prețul/l, totalul și data dintr-un text citit (OCR) de pe bonul de la benzinărie.
          // Verifică relația litri × preț ≈ total, ca să nu se bazeze doar pe cuvintele de pe bon.
          object ReceiptParser {

              private class Num(val v: Double, val line: Int)

              private val numRe = Regex("""(?<![\d.,])(\d{1,4}[.,]\d{1,4})(?![\d.,])""")
              private val dateRe = Regex("""(?<!\d)(\d{1,2})[./-](\d{1,2})[./-](\d{4}|\d{2})(?!\d)""")
              private val mulRe = Regex("""(\d{1,3}[.,]\d{1,2})\s*[xX×*]\s*(\d{1,3}[.,]\d{1,4})""")
              private val timeRe = Regex("""\d{1,2}:\d{2}(:\d{2})?""")
              private val totRe = Regex("""total(?!\s*tva)|de plata|plata|plătit|platit""")
              private val litRe = Regex("""\bl\b|litri|litru|ltr|gpl|cant|qty|\d\s*l\b""")
              private val prRe = Regex("""pret|preț|p\.u|/\s*l\b|lei/l|ron/l|\bpu\b""")

              private fun toDate(m: MatchResult): Long? {
                  val d = m.groupValues[1].toIntOrNull() ?: return null
                  val mo = m.groupValues[2].toIntOrNull() ?: return null
                  var y = m.groupValues[3].toIntOrNull() ?: return null
                  if (y < 100) y += 2000
                  if (d < 1 || d > 31 || mo < 1 || mo > 12 || y < 2015 || y > 2100) return null
                  val c = Calendar.getInstance()
                  c.clear()
                  c.set(y, mo - 1, d, 0, 0, 0)
                  return c.timeInMillis
              }

              fun parse(text: String): Receipt {
                  val lines = text.split('\n')
                  val low = lines.map { it.lowercase() }
                  var date: Long? = null
                  val nums = ArrayList<Num>()
                  for (i in lines.indices) {
                      var line = lines[i]
                      val dm = dateRe.find(line)
                      if (dm != null) {
                          if (date == null) date = toDate(dm)
                          line = line.replace(dateRe, " ")
                      }
                      line = line.replace(timeRe, " ")
                      for (m in numRe.findAll(line)) {
                          val v = m.groupValues[1].replace(',', '.').toDoubleOrNull()
                          if (v != null) nums.add(Num(v, i))
                      }
                  }

                  fun near(i: Int, re: Regex): Boolean {
                      if (i in low.indices && re.containsMatchIn(low[i])) return true
                      if (i - 1 in low.indices && re.containsMatchIn(low[i - 1])) return true
                      return false
                  }

                  // 0) rândul tipărit "4,59 X32,6797 LITRU" = preț × litri
                  val mm = mulRe.find(text)
                  if (mm != null) {
                      val pr = mm.groupValues[1].replace(',', '.').toDoubleOrNull()
                      val li = mm.groupValues[2].replace(',', '.').toDoubleOrNull()
                      if (pr != null && li != null && pr >= 1.5 && pr <= 20.0 && li >= 3.0 && li <= 120.0) {
                          val calc = pr * li
                          var tot: Double? = null
                          var bd = 1e9
                          for (n in nums) {
                              val dd = Math.abs(n.v - calc)
                              if (n.v >= 5.0 && dd < bd && dd <= 0.03 * calc + 0.06) {
                                  bd = dd
                                  tot = n.v
                              }
                          }
                          val finalTotal = tot ?: (Math.round(calc * 100.0) / 100.0)
                          return Receipt(Math.round(li * 100.0) / 100.0, pr, finalTotal, date, true)
                      }
                  }

                  // 1) caută triplete litri × preț = total
                  var bl: Num? = null
                  var bp: Num? = null
                  var bt: Num? = null
                  var bestScore = -1.0
                  for (l in nums) {
                      if (l.v < 3.0 || l.v > 120.0) continue
                      for (p in nums) {
                          if (p === l) continue
                          if (p.v < 1.5 || p.v > 20.0) continue
                          for (t in nums) {
                              if (t === l || t === p) continue
                              if (t.v < 5.0 || t.v > 1500.0) continue
                              val tol = 0.03 * t.v + 0.06
                              val diff = Math.abs(l.v * p.v - t.v)
                              if (diff > tol) continue
                              var s = 1.0 - diff / tol
                              if (near(t.line, totRe)) s += 2.0
                              if (near(l.line, litRe)) s += 1.0
                              if (near(p.line, prRe)) s += 1.0
                              if (p.v >= 2.0 && p.v <= 9.0) s += 0.5
                              if (l.v > p.v) s += 0.5
                              s += t.v / 100000.0
                              if (s > bestScore) {
                                  bestScore = s
                                  bl = l
                                  bp = p
                                  bt = t
                              }
                          }
                      }
                  }
                  if (bl != null && bp != null && bt != null) {
                      return Receipt(bl.v, bp.v, bt.v, date, true)
                  }

                  // 2) fără verificare: ce se găsește lângă cuvintele cheie
                  var total: Double? = null
                  for (n in nums) {
                      if (n.v >= 5.0 && n.v <= 1500.0 && near(n.line, totRe)) {
                          if (total == null || n.v > total) total = n.v
                      }
                  }
                  var liters: Double? = null
                  for (n in nums) {
                      if (n.v >= 3.0 && n.v <= 120.0 && n.v != total && near(n.line, litRe)) {
                          liters = n.v
                          break
                      }
                  }
                  var price: Double? = null
                  for (n in nums) {
                      if (n.v >= 1.5 && n.v <= 20.0 && n.v != liters && near(n.line, prRe)) {
                          price = n.v
                          break
                      }
                  }
                  if (total == null && liters != null && price != null) {
                      total = Math.round(liters * price * 100.0) / 100.0
                  }
                  if (liters == null && total != null && price != null && price > 0.0) {
                      liters = Math.round(total / price * 100.0) / 100.0
                  }
                  return Receipt(liters, price, total, date, false)
              }
          }
