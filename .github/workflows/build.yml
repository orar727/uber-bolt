                  rawText = text
                  val r = ReceiptParser.parse(text)
                  val l = r.liters
                  val t = r.total
                  val p = r.price
                  val d = r.date
                  pendL = if (l != null) Ui.num(l, 2) else ""
                  pendT = if (t != null) Ui.num(t, 2) else ""
                  pendP = if (p != null) Ui.num(p, 2) else ""
                  pendD = if (d != null) SimpleDateFormat("dd.MM.yyyy", loc).format(Date(d)) else ""
                  pendNote = if (text.isBlank()) {
                      "Nu am citit niciun text de pe poză. Fă poza mai aproape, cu lumină bună."
                  } else if (l == null && t == null) {
                      "Nu am găsit valori pe poză. Încearcă o poză dreaptă, cu lumină bună, cu tot bonul în cadru."
                  } else if (r.sure) {
                      "Citit din poză: " + pendL + " l × " + pendP + " lei/l = " + pendT + " lei. Verifică înainte să salvezi."
                  } else {
                      "Citire nesigură. Verifică și completează ce lipsește."
                  }
                  show(1)
              }

