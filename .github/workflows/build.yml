              private fun fetchTile(z: Int, x: Int, y: Int): Bitmap? {
                  try {
                      val c = URL("https://tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png").openConnection() as HttpURLConnection
                      c.connectTimeout = 2500
                      c.readTimeout = 2500
                      c.setRequestProperty("User-Agent", "FCM-APP/2.4 (uz personal)")
                      val b = c.inputStream.use { BitmapFactory.decodeStream(it) }
                      c.disconnect()
                      return b
                  } catch (e: Exception) {
                      return null
                  }
              }

              // 256×256 px în jurul destinației, cu pin
              private fun buildTile(lat: Double, lon: Double): Bitmap? {
                  val z = 15
                  val n = Math.pow(2.0, z.toDouble())
                  val px = (lon + 180.0) / 360.0 * n * 256.0
                  val latRad = Math.toRadians(lat)
                  val py = (1.0 - Math.log(Math.tan(latRad) + 1.0 / Math.cos(latRad)) / Math.PI) / 2.0 * n * 256.0
                  val left = px - 128.0
                  val top = py - 128.0
                  val tx0 = Math.floor(left / 256.0).toInt()
                  val ty0 = Math.floor(top / 256.0).toInt()
                  val out = Bitmap.createBitmap(256, 256, Bitmap.Config.ARGB_8888)
                  val cv = Canvas(out)
                  cv.drawColor(Color.parseColor("#E8EAED"))
                  var got = 0
                  for (ix in 0..1) {
                      for (iy in 0..1) {
                          val t = fetchTile(z, tx0 + ix, ty0 + iy)
                          if (t != null) {
                              got++
                              cv.drawBitmap(t, ((tx0 + ix) * 256.0 - left).toFloat(), ((ty0 + iy) * 256.0 - top).toFloat(), null)
                          }
                      }
                  }
                  if (got == 0) return null
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = Color.WHITE
                  cv.drawCircle(128f, 128f, 17f, p)
                  p.color = Color.parseColor("#E5252F")
                  cv.drawCircle(128f, 128f, 12f, p)
                  p.color = Color.WHITE
                  cv.drawCircle(128f, 128f, 4f, p)
                  return out
              }

              private fun ocr() {
                  if (Build.VERSION.SDK_INT < 30) return
                  val now = SystemClock.uptimeMillis()
                  if (ocrBusy && now - ocrStart > 4000) ocrBusy = false
                  if (ocrBusy) return
                  if (now - lastOcr < 400) return
                  lastOcr = now
                  ocrStart = now
                  ocrBusy = true
                  nOcr++

                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              lastShotCode = "ok"
                              var crop: Bitmap? = null
                              try {
                                  val hb = result.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  val sw = hw?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                                  if (sw != null) {
                                      // cardul de ofertă e în partea de jos; tăiem partea de sus (banda noastră, Waze)
                                      val top = (sw.height * 0.35).toInt()
                                      crop = Bitmap.createBitmap(sw, 0, top, sw.width, sw.height - top)
                                  }
                              } catch (e: Exception) {
