          cat > app/src/main/java/ro/calculatorcursa/Calc.kt <<'EOF'
          package ro.calculatorcursa

          import android.content.Context

          object Prefs {
              // cheie, etichetă, valoare implicită
              val defs = listOf(
                  Triple("price", "Preț combustibil (lei/l sau lei/kWh)", "8.6"),
                  Triple("cons", "Consum (l sau kWh la 100 km)", "5.8"),
                  Triple("wear", "Uzură și întreținere (lei/km, 0 = ignorată)", "0"),
                  Triple("comBolt", "Comision Bolt scăzut în plus (%)", "0"),
                  Triple("comUber", "Comision Uber scăzut în plus (%)", "0"),
                  Triple("minKm", "Prag lei/km (încasare ÷ km total)", "2.5"),
                  Triple("minH", "Prag lei/oră (0 = ignorat)", "0")
              )

              fun raw(ctx: Context, key: String): String {
                  val d = defs.first { it.first == key }.third
                  return ctx.getSharedPreferences("cfg2", Context.MODE_PRIVATE).getString(key, d) ?: d
              }

              fun get(ctx: Context, key: String): Double {
                  val d = defs.first { it.first == key }.third
                  return raw(ctx, key).replace(',', '.').toDoubleOrNull() ?: d.toDouble()
              }

              fun save(ctx: Context, key: String, value: String) {
                  ctx.getSharedPreferences("cfg2", Context.MODE_PRIVATE).edit().putString(key, value).apply()
              }
          }

          data class Result(
              val net: Double, // profit = încasare - combustibil - uzură
              val fuel: Double,
              val perKm: Double,
              val perHour: Double,
              val verdict: Int // 2 = acceptă, 1 = limită, 0 = refuză
          )

          object Calc {
              fun compute(ctx: Context, o: Offer): Result {
                  val km = o.pickupKm + o.tripKm
                  val min = maxOf(o.pickupMin + o.tripMin, 1.0)
                  val com = if (o.platform == "Bolt") Prefs.get(ctx, "comBolt") else Prefs.get(ctx, "comUber")
                  val income = o.fare * (1.0 - com / 100.0)
                  val fuel = km * Prefs.get(ctx, "cons") / 100.0 * Prefs.get(ctx, "price")
                  val wear = km * Prefs.get(ctx, "wear")
                  val profit = income - fuel - wear
                  // ca în Uber ("Est. RON/km") și Ride: din suma încasată, nu din profit
                  val perKm = if (km > 0) income / km else 0.0
                  val perHour = income / (min / 60.0)
                  val minKm = Prefs.get(ctx, "minKm")
                  val minH = Prefs.get(ctx, "minH")
                  val goodKm = perKm >= minKm
                  val goodH = minH <= 0.0 || perHour >= minH
                  val v = when {
                      profit <= 0.0 -> 0
                      goodKm && goodH -> 2
                      goodKm || perKm >= minKm * 0.8 -> 1
                      else -> 0
                  }
                  return Result(profit, fuel, perKm, perHour, v)
              }
          }
          EOF
          cat > app/src/main/java/ro/calculatorcursa/Store.kt <<'EOF'
          package ro.calculatorcursa

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Fill(val id: Long, val date: Long, val liters: Double, val total: Double, val odo: Double)

          data class Tip(val id: Long, val date: Long, val cash: Double, val fare: Double, val tip: Double, val rest: Double = 0.0)

          data class Shift(val id: Long, val start: Long, val end: Long, val km: Double, val pausedMs: Long = 0L, val bolt: Double = 0.0, val uber: Double = 0.0)

          object Store {
              private fun sp(ctx: Context) = ctx.getSharedPreferences("data", Context.MODE_PRIVATE)

              // ---------- bonuri GPL ----------
              fun fills(ctx: Context): List<Fill> {
                  val out = ArrayList<Fill>()
                  try {
                      val a = JSONArray(sp(ctx).getString("fills", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Fill(o.getLong("id"), o.getLong("date"), o.getDouble("l"), o.getDouble("t"), o.optDouble("odo", 0.0)))
                      }
                  } catch (e: Exception) {
                  }
                  return out.sortedByDescending { it.date }
              }

              private fun saveFills(ctx: Context, list: List<Fill>) {
                  val a = JSONArray()
                  for (f in list) {
                      val o = JSONObject()
                      o.put("id", f.id)
                      o.put("date", f.date)
                      o.put("l", f.liters)
                      o.put("t", f.total)
                      o.put("odo", f.odo)
                      a.put(o)
                  }
                  sp(ctx).edit().putString("fills", a.toString()).apply()
              }

              fun addFill(ctx: Context, date: Long, liters: Double, total: Double, odo: Double) {
                  val l = fills(ctx).toMutableList()
                  l.add(Fill(System.currentTimeMillis(), date, liters, total, odo))
                  saveFills(ctx, l)
              }

              fun deleteFill(ctx: Context, id: Long) {
                  saveFills(ctx, fills(ctx).filter { it.id != id })
              }

              // ---------- bacșiș (cash − preț comandă) ----------
              fun tips(ctx: Context): List<Tip> {
                  val out = ArrayList<Tip>()
                  try {
                      val a = JSONArray(sp(ctx).getString("tips", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Tip(o.getLong("id"), o.getLong("d"), o.getDouble("c"), o.getDouble("f"), o.getDouble("t"), o.optDouble("r", 0.0)))
                      }
                  } catch (e: Exception) {
                  }
                  return out.sortedByDescending { it.date }
              }

              private fun saveTips(ctx: Context, list: List<Tip>) {
                  val a = JSONArray()
                  for (t in list) {
                      val o = JSONObject()
                      o.put("id", t.id)
                      o.put("d", t.date)
                      o.put("c", t.cash)
                      o.put("f", t.fare)
                      o.put("t", t.tip)
                      o.put("r", t.rest)
                      a.put(o)
                  }
                  sp(ctx).edit().putString("tips", a.toString()).apply()
              }

              // bacșiș = cash primit − preț comandă − rest dat clientului
              fun addTip(ctx: Context, cash: Double, fare: Double, rest: Double) {
                  val l = tips(ctx).toMutableList()
                  val now = System.currentTimeMillis()
                  l.add(Tip(now, now, cash, fare, cash - fare - rest, rest))
                  saveTips(ctx, l)
              }

              fun deleteTip(ctx: Context, id: Long) {
                  saveTips(ctx, tips(ctx).filter { it.id != id })
              }

              // ---------- ultimele solduri introduse (valabile în săptămâna curentă) ----------
              fun weekBolt(ctx: Context, weekStart: Long): Double? {
                  if (sp(ctx).getLong("last_bt", 0L) < weekStart) return null
                  return sp(ctx).getString("last_b", null)?.toDoubleOrNull()
              }

              fun weekUber(ctx: Context, weekStart: Long): Double? {
                  if (sp(ctx).getLong("last_ut", 0L) < weekStart) return null
                  return sp(ctx).getString("last_u", null)?.toDoubleOrNull()
              }

              private fun saveLastBal(ctx: Context, b: Double?, u: Double?) {
                  val e = sp(ctx).edit()
                  val now = System.currentTimeMillis()
                  if (b != null) e.putString("last_b", b.toString()).putLong("last_bt", now)
                  if (u != null) e.putString("last_u", u.toString()).putLong("last_ut", now)
                  e.apply()
              }

              // ---------- calcul săptămânal (valori editabile) ----------
              fun gGet(ctx: Context, key: String, def: String): String = sp(ctx).getString("g_" + key, def) ?: def

              fun gSet(ctx: Context, key: String, v: String) {
                  sp(ctx).edit().putString("g_" + key, v).apply()
              }

              fun wkGet(ctx: Context, key: String, weekStart: Long): String? = sp(ctx).getString("wk_" + key + "_" + weekStart, null)

              fun wkSet(ctx: Context, key: String, weekStart: Long, v: String) {
                  sp(ctx).edit().putString("wk_" + key + "_" + weekStart, v).apply()
              }

              // ---------- copie de siguranță ----------
              fun exportAll(ctx: Context): String {
                  val root = JSONObject()
                  root.put("app", "FCM")
                  root.put("v", 1)
                  for (name in listOf("data", "cfg2")) {
                      val o = JSONObject()
                      for ((k, v) in ctx.getSharedPreferences(name, Context.MODE_PRIVATE).all) {
                          val e = JSONObject()
                          if (v is String) {
                              e.put("t", "s")
                              e.put("v", v)
                          } else if (v is Long) {
                              e.put("t", "l")
                              e.put("v", v)
                          } else if (v is Int) {
                              e.put("t", "i")
                              e.put("v", v)
                          } else if (v is Boolean) {
                              e.put("t", "b")
                              e.put("v", v)
                          } else if (v is Float) {
                              e.put("t", "f")
                              e.put("v", v.toDouble())
                          } else {
                              continue
                          }
                          o.put(k, e)
                      }
                      root.put(name, o)
                  }
                  return root.toString()
              }

              fun importAll(ctx: Context, text: String): Boolean {
                  try {
                      val root = JSONObject(text)
                      if (root.optString("app") != "FCM") return false
                      for (name in listOf("data", "cfg2")) {
                          val o = root.optJSONObject(name) ?: continue
                          val ed = ctx.getSharedPreferences(name, Context.MODE_PRIVATE).edit()
                          ed.clear()
                          val keys = o.keys()
                          while (keys.hasNext()) {
                              val k = keys.next()
                              val e = o.getJSONObject(k)
                              val t = e.getString("t")
                              if (t == "s") ed.putString(k, e.getString("v"))
                              else if (t == "l") ed.putLong(k, e.getLong("v"))
                              else if (t == "i") ed.putInt(k, e.getInt("v"))
                              else if (t == "b") ed.putBoolean(k, e.getBoolean("v"))
                              else if (t == "f") ed.putFloat(k, e.getDouble("v").toFloat())
                          }
                          ed.apply()
                      }
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              // ---------- ture ----------
              fun shifts(ctx: Context): List<Shift> {
                  val out = ArrayList<Shift>()
                  try {
                      val a = JSONArray(sp(ctx).getString("shifts", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Shift(o.getLong("id"), o.getLong("s"), o.getLong("e"), o.getDouble("km"), o.optLong("pm", 0L), o.optDouble("ib", 0.0), o.optDouble("iu", 0.0)))
                      }
                  } catch (e: Exception) {
                  }
                  return out.sortedByDescending { it.start }
              }

              private fun saveShifts(ctx: Context, list: List<Shift>) {
                  val a = JSONArray()
                  for (s in list) {
                      val o = JSONObject()
                      o.put("id", s.id)
                      o.put("s", s.start)
                      o.put("e", s.end)
                      o.put("km", s.km)
                      o.put("pm", s.pausedMs)
                      o.put("ib", s.bolt)
                      o.put("iu", s.uber)
                      a.put(o)
                  }
                  sp(ctx).edit().putString("shifts", a.toString()).apply()
              }

              fun deleteShift(ctx: Context, id: Long) {
                  saveShifts(ctx, shifts(ctx).filter { it.id != id })
              }

              // ---------- tura activă ----------
              fun activeStart(ctx: Context): Long = sp(ctx).getLong("act_start", 0L)

              fun activeKm(ctx: Context): Double = sp(ctx).getString("act_km", "0")?.toDoubleOrNull() ?: 0.0

              fun setActiveKm(ctx: Context, km: Double) {
                  sp(ctx).edit().putString("act_km", km.toString()).apply()
              }

              fun startShift(ctx: Context) {
                  sp(ctx).edit().putLong("act_start", System.currentTimeMillis()).putString("act_km", "0")
                      .remove("act_pause_at").remove("act_pause_ms").remove("act_fix").remove("act_b0").remove("act_u0").apply()
              }

              fun setStartBalance(ctx: Context, b: Double?, u: Double?) {
                  val e = sp(ctx).edit()
                  if (b != null) e.putString("act_b0", b.toString()) else e.remove("act_b0")
                  if (u != null) e.putString("act_u0", u.toString()) else e.remove("act_u0")
                  e.apply()
              }

              fun startBoltBal(ctx: Context): Double? = sp(ctx).getString("act_b0", null)?.toDoubleOrNull()

              fun startUberBal(ctx: Context): Double? = sp(ctx).getString("act_u0", null)?.toDoubleOrNull()

              fun setIncome(ctx: Context, id: Long, b: Double, u: Double) {
                  val l = shifts(ctx).map { if (it.id == id) it.copy(bolt = b, uber = u) else it }
                  saveShifts(ctx, l)
              }

              fun isPaused(ctx: Context): Boolean = sp(ctx).getLong("act_pause_at", 0L) != 0L

              fun pausedTotal(ctx: Context): Long = sp(ctx).getLong("act_pause_ms", 0L)

              fun pauseShift(ctx: Context) {
                  if (!isPaused(ctx)) sp(ctx).edit().putLong("act_pause_at", System.currentTimeMillis()).apply()
              }

              fun resumeShift(ctx: Context) {
                  val a = sp(ctx).getLong("act_pause_at", 0L)
                  if (a != 0L) {
                      val total = pausedTotal(ctx) + (System.currentTimeMillis() - a)
                      sp(ctx).edit().putLong("act_pause_ms", total).remove("act_pause_at").apply()
                  }
              }

              // timpul efectiv de lucru (fără pauze)
              fun activeElapsed(ctx: Context): Long {
                  val s = activeStart(ctx)
                  if (s == 0L) return 0L
                  val now = System.currentTimeMillis()
                  val a = sp(ctx).getLong("act_pause_at", 0L)
                  val cur = if (a != 0L) now - a else 0L
                  return now - s - pausedTotal(ctx) - cur
              }

              fun setFix(ctx: Context, t: Long) {
                  sp(ctx).edit().putLong("act_fix", t).apply()
              }

              fun lastFix(ctx: Context): Long = sp(ctx).getLong("act_fix", 0L)

              // soldurile afișate în aplicații la sfârșitul turei; încasarea = sold final − sold inițial
              fun endShift(ctx: Context, boltEnd: Double?, uberEnd: Double?) {
                  val s = activeStart(ctx)
                  if (s == 0L) return
                  resumeShift(ctx)
                  val km = activeKm(ctx)
                  val l = shifts(ctx).toMutableList()
                  val now = System.currentTimeMillis()
                  val b0 = startBoltBal(ctx)
                  val u0 = startUberBal(ctx)
                  saveLastBal(ctx, boltEnd, uberEnd)
                  val ib = if (b0 != null && boltEnd != null) boltEnd - b0 else 0.0
                  val iu = if (u0 != null && uberEnd != null) uberEnd - u0 else 0.0
                  l.add(Shift(now, s, now, km, pausedTotal(ctx), ib, iu))
                  saveShifts(ctx, l)
                  sp(ctx).edit().remove("act_start").remove("act_km").remove("act_pause_ms").remove("act_pause_at").remove("act_fix").remove("act_b0").remove("act_u0").apply()
              }
          }
          EOF
          cat > app/src/main/java/ro/calculatorcursa/Ui.kt <<'EOF'
          package ro.calculatorcursa

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.InputType
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale

          object Ui {
              val BG = Color.parseColor("#0B0F17")
              val SURFACE = Color.parseColor("#131A26")
              val SURFACE2 = Color.parseColor("#1B2434")
              val LINE = Color.parseColor("#273247")
              val TEXT = Color.parseColor("#F2F5FA")
              val MUTED = Color.parseColor("#8D99AE")
              val ACCENT = Color.parseColor("#FFC233")
              val ACCENT_FG = Color.parseColor("#1A1200")
              val GOOD = Color.parseColor("#4FD1A0")
              val BAD = Color.parseColor("#FF7B84")

              fun dp(ctx: Context, v: Int): Int = (v * ctx.resources.displayMetrics.density).toInt()

              fun num(v: Double, decimals: Int): String =
                  String.format(Locale("ro", "RO"), "%." + decimals + "f", v)

              fun rounded(ctx: Context, color: Int, radiusDp: Int, strokeColor: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(ctx, radiusDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dp(ctx, strokeDp), strokeColor)
                  return g
              }

              fun gradient(ctx: Context, c1: Int, c2: Int, radiusDp: Int, strokeColor: Int, strokeDp: Int): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(c1, c2))
                  g.cornerRadius = dp(ctx, radiusDp).toFloat()
                  if (strokeDp > 0) g.setStroke(dp(ctx, strokeDp), strokeColor)
                  return g
              }

              fun lp(ctx: Context, bottomDp: Int = 0, topDp: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  p.setMargins(0, dp(ctx, topDp), 0, dp(ctx, bottomDp))
                  return p
              }

              fun card(ctx: Context): LinearLayout {
                  val c = LinearLayout(ctx)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(ctx, 18), dp(ctx, 16), dp(ctx, 18), dp(ctx, 16))
                  c.background = rounded(ctx, SURFACE, 18, LINE, 1)
                  c.layoutParams = lp(ctx, 14)
                  return c
              }

              // card principal, cu gradient și contur mai vizibil
              fun hero(ctx: Context): LinearLayout {
                  val c = LinearLayout(ctx)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(ctx, 20), dp(ctx, 18), dp(ctx, 20), dp(ctx, 18))
                  c.background = gradient(ctx, Color.parseColor("#22304A"), Color.parseColor("#131A26"), 22, Color.parseColor("#3A4A68"), 1)
                  c.layoutParams = lp(ctx, 14)
                  return c
              }

              fun divider(ctx: Context): View {
                  val v = View(ctx)
                  v.setBackgroundColor(LINE)
                  v.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 1)
                  return v
              }

              fun text(ctx: Context, s: String, size: Float, color: Int = TEXT, bold: Boolean = false): TextView {
                  val t = TextView(ctx)
                  t.text = s
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) {
                      if (size >= 30f) {
                          t.setTypeface(Typeface.DEFAULT_BOLD)
                      } else {
                          t.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL))
                      }
                      // titlurile de secțiune (scrise cu majuscule, mici) primesc spațiere între litere
                      if (size <= 12.5f && s.isNotEmpty() && s == s.uppercase()) t.letterSpacing = 0.12f
                  }
                  return t
              }

              private fun styleButton(b: Button) {
                  b.isAllCaps = false
                  b.textSize = 16f
                  b.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL))
                  b.stateListAnimator = null
                  b.elevation = 0f
                  b.minHeight = dp(b.context, 52)
                  b.minimumHeight = dp(b.context, 52)
                  b.layoutParams = lp(b.context, 4, 12)
              }

              fun button(ctx: Context, label: String, primary: Boolean, onClick: () -> Unit): Button {
                  val b = Button(ctx)
                  b.text = label
                  styleButton(b)
                  if (primary) {
                      b.setTextColor(ACCENT_FG)
                      b.background = rounded(ctx, ACCENT, 14)
                  } else {
                      b.setTextColor(TEXT)
                      b.background = rounded(ctx, SURFACE2, 14, LINE, 1)
                  }
                  b.setOnClickListener { onClick() }
                  return b
              }

              // buton de acțiune sensibilă (ex. închide tura)
              fun danger(ctx: Context, label: String, onClick: () -> Unit): Button {
                  val b = Button(ctx)
                  b.text = label
                  styleButton(b)
                  b.setTextColor(BAD)
                  b.background = rounded(ctx, Color.parseColor("#2A1A20"), 14, BAD, 1)
                  b.setOnClickListener { onClick() }
                  return b
              }

              fun input(ctx: Context, hint: String, decimal: Boolean): EditText {
                  val e = EditText(ctx)
                  e.hint = hint
                  e.setHintTextColor(MUTED)
                  e.setTextColor(TEXT)
                  e.textSize = 17f
                  e.inputType = if (decimal) {
                      InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  } else {
                      InputType.TYPE_CLASS_TEXT
                  }
                  e.setSingleLine(true)
                  e.setPadding(dp(ctx, 14), dp(ctx, 12), dp(ctx, 14), dp(ctx, 12))
                  e.background = rounded(ctx, SURFACE2, 12, LINE, 1)
                  return e
              }
          }
