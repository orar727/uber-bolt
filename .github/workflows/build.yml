                      if (list == null || list.isEmpty()) {
                          lastErr = "adresă negăsită"
                          return null
                      }
                      val a = list[0]
                      val parts = ArrayList<String>()
                      for (x in listOf(a.subLocality, a.locality, a.subAdminArea)) {
                          if (x != null && x.isNotBlank() && !parts.contains(x)) parts.add(x)
                      }
                      val zone = parts.joinToString(", ")
